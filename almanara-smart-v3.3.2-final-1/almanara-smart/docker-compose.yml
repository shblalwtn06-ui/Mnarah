services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: almanara_smart
      POSTGRES_USER: almanara_user
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U almanara_user -d almanara_smart"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: almanara_smart
      DB_USER: almanara_user
      DB_PASSWORD: change-me
      JWT_SECRET: change-this-in-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
